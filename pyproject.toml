[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solid-or"
version = "0.1.0"
description = "An anonymized solver-informed self-distillation implementation for operations research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "accelerate>=1.10,<2",
  "codetiming>=1.4,<2",
  "datasets>=3.0,<5",
  "dill>=0.3.8,<0.5",
  "hydra-core>=1.3,<2",
  "numpy>=1.26,<3",
  "omegaconf>=2.3,<3",
  "packaging>=24,<26",
  "pandas>=2.0,<3",
  "peft>=0.14,<0.19",
  "psutil>=6,<8",
  "pyarrow>=19,<24",
  "pybind11>=2.13,<4",
  "pylatexenc>=2.10,<3",
  "ray[default]>=2.41,<2.54",
  "tensorboard>=2.18,<2.21",
  "tensordict>=0.8,<0.12,!=0.9.0",
  "torch>=2.6,<2.10",
  "torchdata>=0.10,<0.12",
  "transformers>=4.52,<5.4",
]

[project.optional-dependencies]
gpu = [
  "liger-kernel>=0.5",
  "vllm>=0.8.5,<0.16",
]
solvers = [
  "coptpy>=7.2",
  "gurobipy>=12.0",
]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["verl*"]

[tool.setuptools.package-data]
verl = [
  "version/*",
  "trainer/config/*.yaml",
  "trainer/config/*/*.yaml",
]

[tool.ruff]
line-length = 120
